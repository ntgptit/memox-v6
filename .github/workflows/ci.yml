name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  warm_cache:
    name: Warm fast-gate cache
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          cache: true

      - name: Restore generated build cache
        uses: actions/cache@v5
        with:
          path: |
            .dart_tool/build
            .dart_tool/package_config.json
            .dart_tool/package_graph.json
            lib/**/*.g.dart
            lib/**/*.freezed.dart
            lib/l10n/generated
            test/**/*.g.dart
            test/**/*.mocks.dart
          key: memox-generated-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'build.yaml', 'l10n.yaml', 'lib/**/*.dart', 'lib/l10n/*.arb', 'test/**/*.dart') }}
          restore-keys: |
            memox-generated-${{ runner.os }}-

      - name: Refresh generated build cache
        run: node tool/verify/run.mjs --warm-cache

  scope:
    name: Resolve PR scope
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
      scope: ${{ steps.scope.outputs.scope }}
      visual_changes: ${{ steps.scope.outputs.visual_changes }}
      test_count: ${{ steps.scope.outputs.test_count }}
    steps:
      - name: Checkout history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select verification scope
        id: scope
        run: >-
          node tool/verify/ci_scope.mjs
          --base '${{ github.event.pull_request.base.sha }}'
          --head '${{ github.event.pull_request.head.sha }}'
          --github-output "$GITHUB_OUTPUT"

  contracts:
    name: Contracts and architecture
    if: github.event_name == 'pull_request'
    needs: scope
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with guard submodule
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            tools/requirements-ci.txt
            tools/code-verification-guard/requirements.txt

      - name: Install verification dependencies
        run: python -m pip install -r tools/requirements-ci.txt

      - name: Run contracts gate
        run: node tool/verify/run.mjs --docs

  flutter_fast:
    name: Flutter fast gate
    if: >-
      github.event_name == 'pull_request' &&
      needs.scope.outputs.docs_only != 'true' &&
      !contains(github.event.pull_request.labels.*.name, 'full-ci')
    needs: scope
    runs-on: ubuntu-latest
    steps:
      - name: Checkout history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          cache: true

      - name: Restore generated build cache
        uses: actions/cache@v5
        with:
          path: |
            .dart_tool/build
            .dart_tool/package_config.json
            .dart_tool/package_graph.json
            lib/**/*.g.dart
            lib/**/*.freezed.dart
            lib/l10n/generated
            test/**/*.g.dart
            test/**/*.mocks.dart
          key: memox-generated-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'build.yaml', 'l10n.yaml', 'lib/**/*.dart', 'lib/l10n/*.arb', 'test/**/*.dart') }}
          restore-keys: |
            memox-generated-${{ runner.os }}-

      - name: Run affected Flutter gate
        run: >-
          node tool/verify/run.mjs
          --flutter-fast
          --base '${{ github.event.pull_request.base.sha }}'
          --head '${{ github.event.pull_request.head.sha }}'

  full_canonical:
    name: Full Canonical (Windows)
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'full-ci'))
    runs-on: windows-latest
    steps:
      - name: Checkout with guard submodule
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            tools/requirements-ci.txt
            tools/code-verification-guard/requirements.txt

      - name: Install verification dependencies
        run: python -m pip install -r tools/requirements-ci.txt

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          cache: true

      - name: Run full canonical verifier
        run: node tool/verify/run.mjs

  visual_parity:
    name: Kit visual parity
    # The §6.5 merge gate. `scope` has emitted `visual_changes` since the
    # verifier was built; until now no job consumed it, so the rule that no
    # screen-changing PR merges without <3% evidence was enforced by hand.
    if: >-
      github.event_name == 'pull_request' &&
      needs.scope.outputs.visual_changes == 'true'
    needs: scope
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tool/parity/package-lock.json

      - name: Install parity harness
        working-directory: tool/parity
        run: npm ci

      - name: Install Chromium
        working-directory: tool/parity
        run: npx playwright install --with-deps chromium

      # `*.g.dart` is gitignored, so a fresh checkout has none of it and the
      # Web build fails on every `part` directive. The verifier does this for
      # the jobs that call it; these two build Flutter directly and have to
      # ask for it themselves.
      - name: Generate sources
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Run kit visual parity
        run: node tool/parity/run.mjs

      # The diff and both captures are the whole point of a failure: without
      # them a red gate says only "different", not "how".
      - name: Upload parity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-evidence
          path: evidence/parity/
          retention-days: 14

  web_smoke:
    name: Tier-1 Web smoke
    # WBS 5.7.5 criterion 4. Every other Web check in this repo drives the
    # parity entry, which seeds fixtures and installs provider overrides;
    # nothing checked that `lib/main.dart` — the entry users get — boots at
    # all, or that a write it makes survives a page load on the Drift wasm
    # store. Skipped for docs-only PRs, which cannot change either.
    if: >-
      github.event_name == 'pull_request' &&
      needs.scope.outputs.docs_only != 'true'
    needs: scope
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tool/parity/package-lock.json

      # The smoke borrows Playwright from the parity harness rather than
      # installing a second copy; `tool/smoke/web.mjs` imports it from there.
      - name: Install parity harness
        working-directory: tool/parity
        run: npm ci

      - name: Install Chromium
        working-directory: tool/parity
        run: npx playwright install --with-deps chromium

      # `*.g.dart` is gitignored, so a fresh checkout has none of it and the
      # Web build fails on every `part` directive. The verifier does this for
      # the jobs that call it; these two build Flutter directly and have to
      # ask for it themselves.
      - name: Generate sources
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Run the Tier-1 Web smoke
        run: node tool/smoke/web.mjs

      # The screenshots are the whole point of a failure: Flutter paints to
      # canvas, so the page text says nothing and only the picture separates
      # "wrong expectation" from "the shipping entry does not boot".
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-smoke-evidence
          path: evidence/smoke/web/
          retention-days: 14

  gate:
    name: CI Gate
    if: always() && github.event_name == 'pull_request'
    needs:
      [scope, contracts, flutter_fast, full_canonical, visual_parity, web_smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Require the selected gates
        env:
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
          DOCS_ONLY: ${{ needs.scope.outputs.docs_only }}
          FAST_RESULT: ${{ needs.flutter_fast.result }}
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
          FULL_RESULT: ${{ needs.full_canonical.result }}
          SCOPE_RESULT: ${{ needs.scope.result }}
          VISUAL_CHANGES: ${{ needs.scope.outputs.visual_changes }}
          VISUAL_RESULT: ${{ needs.visual_parity.result }}
          DOCS_ONLY_SMOKE: ${{ needs.scope.outputs.docs_only }}
          SMOKE_RESULT: ${{ needs.web_smoke.result }}
        run: |
          if [[ "$SCOPE_RESULT" != "success" || "$CONTRACTS_RESULT" != "success" ]]; then
            exit 1
          fi
          if [[ "$FULL_LABEL" == "true" ]]; then
            [[ "$FULL_RESULT" == "success" ]]
            exit
          fi
          # Any PR that touches the app must boot on Tier-1 Web. Docs-only
          # PRs skip the job, and skipped is the only non-success accepted —
          # the same shape as the parity rule below.
          if [[ "$DOCS_ONLY_SMOKE" != "true" ]]; then
            if [[ "$SMOKE_RESULT" != "success" ]]; then
              echo "The Tier-1 Web smoke did not pass."
              exit 1
            fi
          fi
          # A screen-changing PR must carry parity evidence (§6.5). When
          # nothing visual changed the job is skipped, and skipped is the
          # only non-success this accepts.
          if [[ "$VISUAL_CHANGES" == "true" ]]; then
            if [[ "$VISUAL_RESULT" != "success" ]]; then
              echo "Visual changes present but the parity gate did not pass."
              exit 1
            fi
          elif [[ "$VISUAL_RESULT" != "skipped" ]]; then
            echo "Parity job ran without visual changes; scope resolution is wrong."
            exit 1
          fi
          if [[ "$DOCS_ONLY" == "true" ]]; then
            [[ "$FAST_RESULT" == "skipped" ]]
            exit
          fi
          [[ "$FAST_RESULT" == "success" ]]
